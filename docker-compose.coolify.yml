# Deploy PMBM di VPS Coolify MTsN 2 Kota Malang
# - Database : resource PostgreSQL TERPISAH di Coolify (tidak dibuat di file ini)
# - Upload   : folder VPS /data/pmbm/storage (permanen, aman saat redeploy)
# - Jaringan : "coolify" agar bisa menjangkau database lewat UUID-nya

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-PMBM MTsN 2 Kota Malang}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Isi APP_KEY}
  APP_URL: ${APP_URL:?Isi APP_URL}
  APP_LOCALE: id
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: id_ID
  TRUSTED_PROXIES: "*"

  LOG_CHANNEL: stack
  LOG_STACK: daily,stderr
  LOG_LEVEL: ${LOG_LEVEL:-error}
  LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}

  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:?Isi DB_HOST (UUID resource PostgreSQL)}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME:?Isi DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD}

  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax
  CACHE_STORE: database
  CACHE_PREFIX: pmbm_
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  BROADCAST_CONNECTION: log

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@mtsn2kotamalang.sch.id}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PMBM MTsN 2 Kota Malang}

  WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_SENDER_NUMBER: ${WHATSAPP_SENDER_NUMBER:-}
  WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
  WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}

  MAINTENANCE_ALLOWED_IPS: ${MAINTENANCE_ALLOWED_IPS:-}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-volumes: &app-volumes
  - /data/pmbm/storage/app:/var/www/html/storage/app
  - /data/pmbm/storage/logs:/var/www/html/storage/logs

services:
  app:
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_TIMEOUT: "60"
      AUTORUN_LARAVEL_STORAGE_LINK: "false"
    volumes: *app-volumes
    expose:
      - "8080"
    networks:
      - coolify

  worker:
    build: *app-build
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3", "--max-time=3600"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
    volumes: *app-volumes
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build: *app-build
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
    volumes: *app-volumes
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

networks:
  coolify:
    external: true
