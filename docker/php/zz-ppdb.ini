; Pengaturan PHP tambahan untuk image Docker (dimuat terakhir).
; Batas upload, memori, timezone, dan opcache diatur lewat variabel PHP_* di Dockerfile/compose.

; Mitigasi PHP2Shell (CVE-2026-109618): Laravel tidak memakai fitur ini.
session.upload_progress.enabled = Off

; Jangan umumkan versi PHP di header X-Powered-By.
expose_php = Off
