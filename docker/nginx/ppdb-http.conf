# Dimuat di blok http {} (via /etc/nginx/conf.d/*.conf).
#
# Mitigasi PHP2Shell (CVE-2026-109618): Laravel memakai cookie sesi sendiri, bukan PHPSESSID.
# Cookie PHPSESSID dibuang sebelum diteruskan ke PHP-FPM (dipakai oleh fastcgi_params di Dockerfile)
# agar fitur session upload progress PHP tidak bisa dipicu. Cookie lain tetap utuh.
map $http_cookie $ppdb_cookie {
    default $http_cookie;
    "~^(?<ppdb_pre>.*?)\bPHPSESSID=[^;]*;?\s*(?<ppdb_post>.*)$" "$ppdb_pre$ppdb_post";
}
