# Dimuat di blok server {} (via /etc/nginx/server-opts.d/*.conf).
# Padanan aturan public/.htaccess untuk Nginx (Nginx tidak membaca .htaccess).

# Mitigasi PHP2Shell (CVE-2026-109618/109619): PHP mengurai body multipart/form-data sebelum
# Laravel berjalan. Unggah berkas di aplikasi ini hanya lewat endpoint Livewire
# /livewire-xxxx/upload-file, jadi multipart ke URL lain ditolak (403) tanpa sampai ke PHP.
# $request_uri = URL asli dari browser (belum dinormalisasi), jadi trik "/upload-file/../login" tetap ditolak.
set $ppdb_multipart_blocked 0;
if ($http_content_type ~* "^\s*multipart/") {
    set $ppdb_multipart_blocked 1;
}
if ($request_uri ~* "^/livewire(-[0-9a-f]+)?/upload-file(\?|$)") {
    set $ppdb_multipart_blocked 0;
}
if ($ppdb_multipart_blocked) {
    return 403;
}

# Hanya public/index.php yang boleh dijalankan sebagai PHP (sama seperti pemblokiran
# file debug/test di .htaccess). File .php lain di public/ dibalas 404.
set $ppdb_php_blocked 0;
if ($uri ~* "\.php(/|$)") {
    set $ppdb_php_blocked 1;
}
if ($uri = /index.php) {
    set $ppdb_php_blocked 0;
}
if ($ppdb_php_blocked) {
    return 404;
}
