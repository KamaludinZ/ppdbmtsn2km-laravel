# Deploy aplikasi PMBM di Coolify (build pack "Docker Compose") atau Docker biasa.
# Panduan lengkap: docs/DEPLOY_COOLIFY.md
#
# Layanan:
#   app       : web (Nginx + PHP-FPM, port 8080). Saat start: migrasi database + cache config/route/view.
#   worker    : antrian (notifikasi) -> php artisan queue:work
#   scheduler : tugas terjadwal (refresh dashboard, antrian WhatsApp) -> php artisan schedule:work
#   postgres  : database PostgreSQL 17
#
# Data permanen ada di volume (TIDAK hilang saat update/redeploy):
#   pmbm-storage : upload pendaftar, dokumen, backup  (storage/app)
#   pmbm-logs    : log aplikasi                        (storage/logs)
#   pmbm-db      : database PostgreSQL
#
# Variabel bertanda ":?" wajib diisi di Coolify (tab Environment Variables).

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-PMBM MTsN 2 Kota Malang}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Isi APP_KEY (format base64:..., lihat docs/DEPLOY_COOLIFY.md)}
  APP_URL: ${APP_URL:?Isi APP_URL, contoh https://pmbm.mtsn2kotamalang.sch.id}
  APP_LOCALE: ${APP_LOCALE:-id}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-id_ID}
  # Hanya Coolify/Traefik yang bisa mengakses container, jadi semua proxy di depannya dipercaya
  TRUSTED_PROXIES: "*"

  LOG_CHANNEL: stack
  LOG_STACK: daily,stderr
  LOG_LEVEL: ${LOG_LEVEL:-error}
  LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}

  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-pmbm}
  DB_USERNAME: ${DB_USERNAME:-pmbm}
  DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD (password acak yang panjang)}

  # Sesi & cache di database: pengguna tidak ter-logout saat redeploy
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: lax
  CACHE_STORE: database
  CACHE_PREFIX: pmbm_
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  BROADCAST_CONNECTION: log

  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@mtsn2kotamalang.sch.id}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PMBM MTsN 2 Kota Malang}

  # WhatsApp (bisa juga diatur dari menu Pengaturan di aplikasi)
  WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_SENDER_NUMBER: ${WHATSAPP_SENDER_NUMBER:-}
  WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
  WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}

  MAINTENANCE_ALLOWED_IPS: ${MAINTENANCE_ALLOWED_IPS:-}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-volumes: &app-volumes
  - pmbm-storage:/var/www/html/storage/app
  - pmbm-logs:/var/www/html/storage/logs

services:
  app:
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *app-env
      # Migrasi & cache hanya dijalankan oleh layanan web, bukan worker/scheduler
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_MIGRATION_TIMEOUT: "60"
      AUTORUN_LARAVEL_STORAGE_LINK: "false"
    volumes: *app-volumes
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: *app-build
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3", "--max-time=3600"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    build: *app-build
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pmbm}
      POSTGRES_USER: ${DB_USERNAME:-pmbm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD (password acak yang panjang)}
      TZ: Asia/Jakarta
    volumes:
      - pmbm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmbm-storage:
  pmbm-logs:
  pmbm-db:
