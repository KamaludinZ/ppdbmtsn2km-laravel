; Pengaturan PHP per-folder (dibaca PHP-FPM / CGI / LiteSpeed LSAPI).
; Perubahan berlaku setelah ±5 menit (user_ini.cache_ttl) atau restart PHP.
;
; Mitigasi PHP2Shell (CVE-2026-109618): matikan "session upload progress".
; Laravel tidak memakai fitur ini (sesi Laravel bukan sesi bawaan PHP), jadi aman dimatikan.
; Ini hanya mitigasi sementara: perbaikan utama tetap update PHP di hosting ke rilis 21 Okt 2026 atau lebih baru.
session.upload_progress.enabled = Off
